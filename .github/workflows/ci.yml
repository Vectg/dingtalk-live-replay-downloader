name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check userscript
        run: node --check "钉钉直播回放下载.user.js"

      - name: Unit tests (extracted from the shipped script)
        run: node test/run.js

      - name: Version bump guard
        run: bash test/version_guard.sh
